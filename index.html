<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faid & Wildan</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

body{
margin:0;
background:#000;
color:#fff;
font-family:'Cinzel',serif;
overflow:hidden;
}

/* شاشة البداية */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

#name{
font-size:55px;
color:gold;
letter-spacing:6px;
}

.enter{
margin-top:40px;
padding:12px 35px;
border:1px solid gold;
background:transparent;
color:gold;
font-size:16px;
cursor:pointer;
transition:0.4s;
}

.enter:hover{
background:gold;
color:black;
box-shadow:0 0 20px gold;
}

/* الصفحة */
#main{
display:none;
height:100vh;
overflow:auto;
text-align:center;
padding:40px 20px;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

/* خلفية متحركة */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url('https://images.unsplash.com/photo-1503342217505-b0a15ec3261c') center/cover;
filter:blur(3px) brightness(0.5);
z-index:-1;
animation:zoom 30s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.2)}
}

/* النص */
h1{
font-size:45px;
color:gold;
margin-top:60px;
}

.subtitle{
color:#ddd;
letter-spacing:2px;
}

/* العد */
.count{
display:flex;
justify-content:center;
gap:15px;
margin-top:40px;
flex-wrap:wrap;
}

.box{
border:1px solid gold;
padding:15px;
min-width:70px;
background:rgba(0,0,0,0.5);
box-shadow:0 0 10px rgba(255,215,0,0.3);
}

.box span{
font-size:28px;
color:gold;
}

/* زر */
.map{
display:inline-block;
margin-top:30px;
padding:12px 25px;
border:1px solid gold;
color:gold;
text-decoration:none;
transition:0.3s;
}

.map:hover{
background:gold;
color:black;
box-shadow:0 0 15px gold;
}
</style>
</head>

<body>

<div id="intro">
<div id="name"></div>
<button class="enter" onclick="start()">Enter Invitation</button>
</div>

<div id="main">
<div class="bg"></div>

<h1>Wedding Invitation</h1>
<p class="subtitle">A New Chapter Begins…</p>

<h2>9 October 2026</h2>
<p>6:00 PM — 9:00 PM</p>
<p>Hammurabi City VIP C</p>

<div class="count">
<div class="box"><span id="d">0</span><br>Days</div>
<div class="box"><span id="h">0</span><br>Hours</div>
<div class="box"><span id="m">0</span><br>Minutes</div>
<div class="box"><span id="s">0</span><br>Seconds</div>
</div>

<a class="map" href="https://www.google.com/maps/search/?api=1&query=مدينة+حمورابي+VIP+C" target="_blank">
📍 View Location
</a>

<br><br>

<audio id="music">
<source src="song.mp3">
</audio>

</div>

<script>
const text="Faid & Wildan";
let i=0;
function type(){
if(i<text.length){
document.getElementById("name").innerHTML+=text.charAt(i);
i++;
setTimeout(type,120);
}
}
type();

function start(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("music").play();
document.body.style.overflow="auto";
}

const target=new Date("2026-10-09T18:00:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=target-now;

document.getElementById("d").innerHTML=Math.floor(diff/86400000);
document.getElementById("h").innerHTML=Math.floor(diff%86400000/3600000);
document.getElementById("m").innerHTML=Math.floor(diff%3600000/60000);
document.getElementById("s").innerHTML=Math.floor(diff%60000/1000);
},1000);
</script>

</body>
</html>
